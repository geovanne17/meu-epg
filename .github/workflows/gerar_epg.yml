name: Gerador de EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script para gerar EPG
      run: |
        python gerar_epg.py

    - name: Fazer Commit e Push do epg.xml atualizado
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add epg.xml
        if git status --porcelain | grep -q 'epg.xml'; then
          git commit -m "Atualização automática do EPG"
          git push
        else
          echo "Nenhuma alteração no epg.xml. Ignorando commit."
        fi
